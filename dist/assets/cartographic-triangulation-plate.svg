<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" fill="none" role="presentation" aria-hidden="true">
  <!-- Archival plate border -->
  <rect x="2" y="2" width="596" height="476" stroke="#25242b" stroke-width="1"/>
  <rect x="8" y="8" width="584" height="464" stroke="#1d1c22" stroke-width="0.5"/>
  
  <!-- Subtle coordinate grid -->
  <g stroke="#1a1921" stroke-width="0.5">
    <line x1="50" y1="8" x2="50" y2="472"/>
    <line x1="150" y1="8" x2="150" y2="472"/>
    <line x1="250" y1="8" x2="250" y2="472"/>
    <line x1="350" y1="8" x2="350" y2="472"/>
    <line x1="450" y1="8" x2="450" y2="472"/>
    <line x1="550" y1="8" x2="550" y2="472"/>
    <line x1="8" y1="80" x2="592" y2="80"/>
    <line x1="8" y1="160" x2="592" y2="160"/>
    <line x1="8" y1="240" x2="592" y2="240"/>
    <line x1="8" y1="320" x2="592" y2="320"/>
    <line x1="8" y1="400" x2="592" y2="400"/>
  </g>
  
  <!-- Measured baseline (The known ground truth) -->
  <g stroke="#b97852" stroke-width="1.5">
    <line x1="90" y1="390" x2="270" y2="390"/>
    <circle cx="90" cy="390" r="3.5" fill="#0b0c0f"/>
    <circle cx="270" cy="390" r="3.5" fill="#0b0c0f"/>
    <!-- Baseline ticks -->
    <line x1="90" y1="384" x2="90" y2="396"/>
    <line x1="180" y1="386" x2="180" y2="394"/>
    <line x1="270" y1="384" x2="270" y2="396"/>
  </g>
  
  <!-- Triangulation mesh propagating outward from baseline -->
  <g stroke="#72b7b2" stroke-width="0.85" opacity="0.75">
    <!-- Primary triangle -->
    <polygon points="90,390 270,390 170,250"/>
    <!-- Secondary triangles -->
    <polygon points="90,390 170,250 80,210"/>
    <polygon points="170,250 270,390 320,270"/>
    <polygon points="170,250 320,270 260,140"/>
    <polygon points="80,210 170,250 260,140 140,110"/>
    <polygon points="260,140 320,270 430,220 390,110"/>
    <polygon points="320,270 270,390 420,380 430,220"/>
    <!-- Extended distant vertices (where context becomes fragile) -->
    <polygon points="390,110 430,220 520,160" stroke-dasharray="2 2" opacity="0.6"/>
    <polygon points="430,220 420,380 530,340" stroke-dasharray="2 2" opacity="0.6"/>
    <polygon points="420,380 530,340 540,410" stroke-dasharray="2 2" opacity="0.4"/>
  </g>
  
  <!-- Vertex nodes -->
  <g fill="#0b0c0f" stroke="#72b7b2" stroke-width="1.2">
    <circle cx="170" cy="250" r="3"/>
    <circle cx="80" cy="210" r="2.5"/>
    <circle cx="320" cy="270" r="3"/>
    <circle cx="140" cy="110" r="2.5"/>
    <circle cx="260" cy="140" r="3.5" stroke="#7562a8"/>
    <circle cx="390" cy="110" r="2.5"/>
    <circle cx="430" cy="220" r="3"/>
    <circle cx="420" cy="380" r="3"/>
    <circle cx="520" cy="160" r="2" stroke="#4e4b5e"/>
    <circle cx="530" cy="340" r="2" stroke="#4e4b5e"/>
  </g>
  
  <!-- Archival plate annotations in Commit Mono -->
  <g font-family="monospace" font-size="8" fill="#585563" letter-spacing="0.08em">
    <text x="140" y="415">BASIS / ORIGIN (GROUND TRUTH)</text>
    <text x="20" y="30">FIG. 01 — TRIANGULATION OF UNVERIFIED SIGHTINGS</text>
    <text x="440" y="460">EVIDENCE HORIZON</text>
  </g>
</svg>
