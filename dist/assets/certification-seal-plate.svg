<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" fill="none" role="presentation" aria-hidden="true">
  <!-- Technical dossier frame -->
  <rect x="2" y="2" width="596" height="356" stroke="#3d2c25" stroke-width="1.2"/>
  <rect x="7" y="7" width="586" height="346" stroke="#251a14" stroke-width="0.5"/>
  
  <!-- Registration tick marks (Hard Gates B0-B14) -->
  <g stroke="#b97852" stroke-width="1" opacity="0.85">
    <!-- Corner marks -->
    <path d="M14 26 L14 14 L26 14"/>
    <path d="M586 26 L586 14 L574 14"/>
    <path d="M14 334 L14 346 L26 346"/>
    <path d="M586 334 L586 346 L574 346"/>
  </g>
  
  <!-- Vernier caliper calibration scale (Measurement rigor) -->
  <g stroke="#5c4436" stroke-width="0.75">
    <line x1="60" y1="45" x2="540" y2="45"/>
    <!-- Millimeter tick divisions -->
    <line x1="60" y1="37" x2="60" y2="45" stroke="#b97852" stroke-width="1.2"/>
    <line x1="100" y1="40" x2="100" y2="45"/>
    <line x1="140" y1="37" x2="140" y2="45" stroke="#b97852" stroke-width="1.2"/>
    <line x1="180" y1="40" x2="180" y2="45"/>
    <line x1="220" y1="37" x2="220" y2="45" stroke="#b97852" stroke-width="1.2"/>
    <line x1="260" y1="40" x2="260" y2="45"/>
    <line x1="300" y1="37" x2="300" y2="45" stroke="#b97852" stroke-width="1.2"/>
    <line x1="340" y1="40" x2="340" y2="45"/>
    <line x1="380" y1="37" x2="380" y2="45" stroke="#b97852" stroke-width="1.2"/>
    <line x1="420" y1="40" x2="420" y2="45"/>
    <line x1="460" y1="37" x2="460" y2="45" stroke="#b97852" stroke-width="1.2"/>
    <line x1="500" y1="40" x2="500" y2="45"/>
    <line x1="540" y1="37" x2="540" y2="45" stroke="#b97852" stroke-width="1.2"/>
  </g>
  
  <!-- Central Verification Seal (Tamper-evident rosette) -->
  <g transform="translate(300, 195)" stroke="#b97852" opacity="0.8">
    <circle cx="0" cy="0" r="88" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="82" stroke-width="0.5" stroke-dasharray="2 3"/>
    <circle cx="0" cy="0" r="70" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="48" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="16" stroke-width="1" fill="#181310"/>
    <!-- Hard gate locks radiating outwards -->
    <path d="M0 -70 L0 -48 M0 48 L0 70 M-70 0 L-48 0 M48 0 L70 0" stroke-width="1.2"/>
    <path d="M-49 -49 L-34 -34 M34 34 L49 49 M-49 49 L-34 34 M34 -34 L49 -49" stroke-width="0.8"/>
    <!-- Hard-closed lock motif in center -->
    <rect x="-8" y="-6" width="16" height="12" rx="1" fill="#0b0c0f" stroke="#df7468" stroke-width="1.2"/>
    <path d="M-5 -6 L-5 -10 C-5 -13 5 -13 5 -10 L5 -6" stroke="#df7468" stroke-width="1.2"/>
  </g>
  
  <!-- Checkpoint gates indicators -->
  <g stroke="#3a2b22" stroke-width="0.8">
    <line x1="70" y1="120" x2="180" y2="120"/>
    <line x1="70" y1="150" x2="180" y2="150"/>
    <line x1="70" y1="180" x2="180" y2="180"/>
    <line x1="70" y1="210" x2="180" y2="210"/>
    <line x1="70" y1="240" x2="180" y2="240"/>
    <line x1="70" y1="270" x2="180" y2="270"/>
    
    <line x1="420" y1="120" x2="530" y2="120"/>
    <line x1="420" y1="150" x2="530" y2="150"/>
    <line x1="420" y1="180" x2="530" y2="180"/>
    <line x1="420" y1="210" x2="530" y2="210"/>
    <line x1="420" y1="240" x2="530" y2="240"/>
    <line x1="420" y1="270" x2="530" y2="270"/>
  </g>
  
  <!-- Annotations in Commit Mono -->
  <g font-family="monospace" font-size="8" fill="#7a5540" letter-spacing="0.1em">
    <text x="60" y="28">VERIFICATION DOSSIER · GATES B0–B14</text>
    <text x="390" y="28">FAIL-CLOSED HARNESS SPECIFICATION</text>
    <text x="215" y="325" fill="#df7468">VERDICT SEAL · BLOCKED (UNPROVEN PRODUCERS)</text>
  </g>
</svg>
