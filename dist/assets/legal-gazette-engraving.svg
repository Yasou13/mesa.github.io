<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none" role="presentation" aria-hidden="true">
  <!-- Guilloche & archival legal register borders -->
  <rect x="2" y="2" width="636" height="356" stroke="#3d2c23" stroke-width="1.2"/>
  <rect x="7" y="7" width="626" height="346" stroke="#261c16" stroke-width="0.6"/>
  <rect x="14" y="14" width="612" height="332" stroke="#4a362b" stroke-width="0.8" stroke-dasharray="4 2"/>
  
  <!-- Corner rosettes -->
  <g stroke="#b97852" stroke-width="0.8" opacity="0.85">
    <circle cx="28" cy="28" r="8"/>
    <circle cx="28" cy="28" r="4"/>
    <circle cx="612" cy="28" r="8"/>
    <circle cx="612" cy="28" r="4"/>
    <circle cx="28" cy="332" r="8"/>
    <circle cx="28" cy="332" r="4"/>
    <circle cx="612" cy="332" r="8"/>
    <circle cx="612" cy="332" r="4"/>
  </g>
  
  <!-- Central official legal seal engraving -->
  <g transform="translate(320, 160)" stroke="#b97852" opacity="0.7">
    <circle cx="0" cy="0" r="72" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="66" stroke-width="0.6" stroke-dasharray="2 3"/>
    <circle cx="0" cy="0" r="54" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="32" stroke-width="0.5"/>
    <!-- Seal radiating spokes / petals -->
    <path d="M0 -54 L0 54 M-54 0 L54 0 M-38 -38 L38 38 M-38 38 L38 -38" stroke-width="0.6"/>
    <!-- Inner scales / heraldic balance -->
    <path d="M-20 -10 L20 -10 M0 -10 L0 18 M-24 10 L-16 10 L-20 2 M16 10 L24 10 L20 2" stroke-width="1" stroke-linecap="round"/>
  </g>
  
  <!-- Formal document column lines (ruled gazette ledger) -->
  <g stroke="#2c2018" stroke-width="0.6">
    <line x1="50" y1="56" x2="210" y2="56"/>
    <line x1="50" y1="74" x2="210" y2="74"/>
    <line x1="50" y1="92" x2="210" y2="92"/>
    <line x1="50" y1="110" x2="210" y2="110"/>
    <line x1="50" y1="128" x2="210" y2="128"/>
    <line x1="50" y1="146" x2="210" y2="146"/>
    <line x1="50" y1="164" x2="210" y2="164"/>
    <line x1="50" y1="182" x2="210" y2="182"/>
    <line x1="50" y1="200" x2="210" y2="200"/>
    <line x1="50" y1="218" x2="210" y2="218"/>
    <line x1="50" y1="236" x2="210" y2="236"/>
    <line x1="50" y1="254" x2="210" y2="254"/>
    
    <line x1="430" y1="56" x2="590" y2="56"/>
    <line x1="430" y1="74" x2="590" y2="74"/>
    <line x1="430" y1="92" x2="590" y2="92"/>
    <line x1="430" y1="110" x2="590" y2="110"/>
    <line x1="430" y1="128" x2="590" y2="128"/>
    <line x1="430" y1="146" x2="590" y2="146"/>
    <line x1="430" y1="164" x2="590" y2="164"/>
    <line x1="430" y1="182" x2="590" y2="182"/>
    <line x1="430" y1="200" x2="590" y2="200"/>
    <line x1="430" y1="218" x2="590" y2="218"/>
    <line x1="430" y1="236" x2="590" y2="236"/>
    <line x1="430" y1="254" x2="590" y2="254"/>
  </g>
  
  <!-- Archival plate annotations in Commit Mono -->
  <g font-family="monospace" font-size="8" fill="#7d5943" letter-spacing="0.1em">
    <text x="50" y="42">ACTA ET DECRETA · JURIDICA</text>
    <text x="430" y="42">MATTER DOSSIER REF. NO. 04</text>
    <text x="250" y="315">SEAL OF PROVENANCE</text>
  </g>
</svg>
