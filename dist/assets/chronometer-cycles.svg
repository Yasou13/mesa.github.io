<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" fill="none" role="presentation" aria-hidden="true">
  <!-- Specimen border -->
  <rect x="2" y="2" width="596" height="356" stroke="#25242b" stroke-width="1"/>
  <rect x="7" y="7" width="586" height="346" stroke="#1c1b22" stroke-width="0.5"/>
  
  <!-- Temporal time axes -->
  <line x1="40" y1="180" x2="560" y2="180" stroke="#363342" stroke-width="0.75"/>
  <line x1="180" y1="30" x2="180" y2="330" stroke="#2a2834" stroke-width="0.5" stroke-dasharray="2 3"/>
  <line x1="380" y1="30" x2="380" y2="330" stroke="#2a2834" stroke-width="0.5" stroke-dasharray="2 3"/>
  
  <!-- Concentric escapement & endurance balance circles -->
  <g transform="translate(180, 180)" stroke="#7562a8" opacity="0.65">
    <circle cx="0" cy="0" r="120" stroke-width="0.75" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="95" stroke-width="1"/>
    <circle cx="0" cy="0" r="65" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="30" stroke-width="0.75"/>
    <circle cx="0" cy="0" r="6" fill="#0b0c0f" stroke-width="1.2"/>
    <!-- Escapement spokes (12 cycle intervals) -->
    <path d="M0 -95 L0 95 M-95 0 L95 0 M-67 -67 L67 67 M-67 67 L67 -67" stroke-width="0.5"/>
  </g>
  
  <!-- Continuous harmonic wave (Repetition & endurance over time) -->
  <path d="M180 180 C230 110 280 110 330 180 S430 250 480 180 S530 110 560 145" stroke="#72b7b2" stroke-width="1.5" opacity="0.8"/>
  <path d="M180 180 C230 250 280 250 330 180 S430 110 480 180 S530 250 560 215" stroke="#7562a8" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.45"/>
  
  <!-- Restart & recovery cycle marker (State survival across disruption) -->
  <g transform="translate(380, 180)">
    <circle cx="0" cy="0" r="45" stroke="#b97852" stroke-width="1.2" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="4" fill="#b97852"/>
    <line x1="0" y1="-55" x2="0" y2="-45" stroke="#b97852" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="0" y2="55" stroke="#b97852" stroke-width="1.5"/>
    <line x1="-55" y1="0" x2="-45" y2="0" stroke="#b97852" stroke-width="1.5"/>
    <line x1="45" y1="0" x2="55" y2="0" stroke="#b97852" stroke-width="1.5"/>
  </g>
  
  <!-- Annotations in Commit Mono -->
  <g font-family="monospace" font-size="8" fill="#5c586c" letter-spacing="0.08em">
    <text x="50" y="35">HOROLOGIUM · SUSTAINED TEMPORAL CYCLES</text>
    <text x="320" y="250" fill="#8e624b">RESTART DURABILITY / CYCLE RESILIENCE</text>
    <text x="470" y="325">TIME HORIZON (t)</text>
  </g>
</svg>
