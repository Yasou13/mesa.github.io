<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" fill="none" role="presentation" aria-hidden="true">
  <!-- Outer specimen frame -->
  <rect x="2" y="2" width="596" height="376" stroke="#252c2c" stroke-width="1"/>
  <rect x="7" y="7" width="586" height="366" stroke="#182020" stroke-width="0.5"/>
  
  <!-- Strata depth gauge (left rail) -->
  <g stroke="#72b7b2" stroke-width="0.75" opacity="0.8">
    <line x1="50" y1="20" x2="50" y2="350"/>
    <line x1="42" y1="20" x2="50" y2="20"/>
    <line x1="45" y1="70" x2="50" y2="70"/>
    <line x1="42" y1="120" x2="50" y2="120"/>
    <line x1="45" y1="170" x2="50" y2="170"/>
    <line x1="42" y1="220" x2="50" y2="220"/>
    <line x1="45" y1="270" x2="50" y2="270"/>
    <line x1="42" y1="320" x2="50" y2="320"/>
    <line x1="42" y1="350" x2="50" y2="350"/>
  </g>
  
  <!-- Strata layer boundaries (cross-section) -->
  <g stroke="#72b7b2" opacity="0.65" stroke-width="0.8">
    <!-- Layer 1: Surface admission (canonicalized) -->
    <path d="M70 45 C150 40 280 50 380 42 C480 35 530 45 570 40" stroke-width="1.2"/>
    <!-- Layer 2: Gated legal texts -->
    <path d="M70 105 C140 115 250 95 360 110 C460 120 520 100 570 105"/>
    <!-- Layer 3: Canonical JSONL partitions -->
    <path d="M70 175 C160 165 270 180 370 170 C470 160 510 175 570 170"/>
    <!-- Layer 4: Frozen release packages -->
    <path d="M70 245 C130 250 240 238 350 252 C460 260 530 245 570 248"/>
    <!-- Layer 5: Immutable raw bytes + SHA-256 bedrock -->
    <path d="M70 315 C150 310 260 322 380 312 C470 305 520 318 570 315" stroke-width="1.5" stroke="#b97852"/>
  </g>
  
  <!-- Layer hatching & micro-textures -->
  <g stroke="#1d2726" stroke-width="0.5">
    <!-- Diagonal hatch for Layer 2 -->
    <line x1="100" y1="65" x2="130" y2="95"/>
    <line x1="160" y1="65" x2="190" y2="95"/>
    <line x1="220" y1="65" x2="250" y2="95"/>
    <line x1="280" y1="65" x2="310" y2="95"/>
    <line x1="340" y1="65" x2="370" y2="95"/>
    <line x1="400" y1="65" x2="430" y2="95"/>
    <line x1="460" y1="65" x2="490" y2="95"/>
    
    <!-- Stipple / vertical strokes for Layer 4 -->
    <line x1="120" y1="190" x2="120" y2="230" stroke-dasharray="2 4"/>
    <line x1="200" y1="190" x2="200" y2="230" stroke-dasharray="2 4"/>
    <line x1="280" y1="190" x2="280" y2="230" stroke-dasharray="2 4"/>
    <line x1="360" y1="190" x2="360" y2="230" stroke-dasharray="2 4"/>
    <line x1="440" y1="190" x2="440" y2="230" stroke-dasharray="2 4"/>
    <line x1="520" y1="190" x2="520" y2="230" stroke-dasharray="2 4"/>
    
    <!-- Dense bedrock dots for Layer 5 (Bedrock bytes) -->
    <circle cx="150" cy="335" r="1.5" fill="#3d2c23"/>
    <circle cx="230" cy="340" r="1.5" fill="#3d2c23"/>
    <circle cx="310" cy="330" r="1.5" fill="#3d2c23"/>
    <circle cx="390" cy="342" r="1.5" fill="#3d2c23"/>
    <circle cx="470" cy="335" r="1.5" fill="#3d2c23"/>
    <circle cx="530" cy="338" r="1.5" fill="#3d2c23"/>
  </g>
  
  <!-- Annotations in Commit Mono -->
  <g font-family="monospace" font-size="8" fill="#4d6160" letter-spacing="0.08em">
    <text x="80" y="32">01 · ADMITTED CANONICAL STRATA</text>
    <text x="80" y="90">02 · GATED REVISIONS</text>
    <text x="80" y="160">03 · STRUCTURED JSONL PARTITIONS</text>
    <text x="80" y="230">04 · FROZEN RELEASES</text>
    <text x="80" y="300" fill="#7d5943">05 · BEDROCK RAW BYTES (IMMUTABLE SHA-256)</text>
  </g>
</svg>
