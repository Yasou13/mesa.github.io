name: Deploy MESA site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sync_documentation]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Verify admin bundle freshness
        run: npm run verify:admin
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run audit regression tests
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          for test in scripts/tests/*.test.mjs; do node "$test"; done
      - name: Synchronize documentation
        run: python3 scripts/sync_docs.py --fallback-cache
      - name: Build static artifact
        env:
          MESA_SUPABASE_URL: ${{ vars.MESA_SUPABASE_URL }}
          MESA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MESA_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/build_site.py --site-url "${{ steps.pages.outputs.base_url }}" --verify-articles
      - name: Verify routes and links
        run: |
          python3 scripts/check_site.py _site
          python3 scripts/check_public_artifact.py _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
